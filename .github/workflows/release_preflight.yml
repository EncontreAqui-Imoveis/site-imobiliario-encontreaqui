name: Site Release Preflight

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Gitleaks scan (blocking)
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact

      - name: Install dependencies
        run: npm ci

      - name: Verify build and tests
        run: npm run ci:verify

      - name: Lighthouse CI (blocking)
        run: npx @lhci/cli@0.13.x autorun --config=./lighthouserc.json

      - name: Enforce ZAP staging URL
        run: |
          if [ -z "${{ secrets.SITE_STAGING_URL }}" ]; then
            echo "SITE_STAGING_URL secret is required for release preflight."
            exit 1
          fi

      - name: ZAP baseline scan (blocking)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ secrets.SITE_STAGING_URL }}
          fail_action: true
          allow_issue_writing: false

      - name: Generate security checklist
        run: |
          cat > release-preflight-site.md <<'EOF'
          # Site Release Preflight

          Status: PASS

          ## Blocking checks executed
          - Gitleaks
          - Tests (`npm run test`)
          - Build (`next build`)
          - Lighthouse CI
          - OWASP ZAP Baseline
          EOF

      - name: Upload release checklist
        uses: actions/upload-artifact@v4
        with:
          name: site-release-preflight
          path: release-preflight-site.md
