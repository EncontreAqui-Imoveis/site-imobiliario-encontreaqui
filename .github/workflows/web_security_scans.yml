name: Site Web Security Scans

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.13.x autorun --config=./lighthouserc.json

  zap-baseline:
    if: ${{ secrets.SITE_STAGING_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ secrets.SITE_STAGING_URL }}
          fail_action: false
          allow_issue_writing: false
